name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.10 is the floor the app supports, 3.12 the modern target. Both must
        # be green: 5.1.17 shipped an f-string that only 3.12 accepts, and only
        # the 3.10 jobs caught it.
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # pywebview needs GTK headers on Linux; the tests themselves never open a
      # window, so only the import path has to work.
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0 xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fails fast, and on every OS, if the tree uses syntax newer than the
      # declared floor. test_syntax_floor.py does the same thing inside pytest.
      # Lint gate: only errors that are always bugs. Style is tracked in
      # CONTRIBUTING.md and does not fail the build.
      - name: Lint (ruff)
        if: matrix.python == '3.12'
        run: |
          pip install ruff==0.17.4
          ruff check .

      - name: Syntax floor (3.10)
        run: python -c "import compileall,sys; sys.exit(0 if compileall.compile_dir('euler', quiet=1, force=True) else 1)"

      - name: Unit tests
        run: pytest tests/ -q

      - name: Release sweep
        run: python tests/sweep_full.py

      - name: JavaScript syntax
        run: |
          node --check app/web/app.js
          node --check app/web/i18n.js
