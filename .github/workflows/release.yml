name: release

# Builds the Windows installer and attaches it to a GitHub release.
# Triggered by pushing a tag like v4.8.0.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Verify before packaging
        run: |
          pytest tests/ -q
          python tests/sweep_full.py

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Freeze the application
        run: pyinstaller build/euler.spec --noconfirm --clean

      - name: Build the installer
        run: |
          copy requirements.txt dist\EulerSC\requirements.txt
          & "C:\Program Files (x86)\NSIS\makensis.exe" build\installer.nsi

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: EulerSC-Setup
          path: dist/EulerSC-Setup.exe
          if-no-files-found: error

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EulerSC-Setup.exe
          generate_release_notes: true
          body: |
            **Σuler.SC ${{ github.ref_name }}**

            A symbolic calculator with a local AI tutor. No account, no cloud.

            See [CHANGELOG.md](CHANGELOG.md) for what changed.

            | File | Notes |
            |---|---|
            | `EulerSC-Setup.exe` | Windows installer, per-user, no admin rights |

            Source code is available under the tag; `build.bat bundled` reproduces
            the installer from a checkout.
